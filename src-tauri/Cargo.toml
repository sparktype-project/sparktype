[package]
name = "app"
version = "0.1.0"
description = "Sparktype: a local-first static site generator and editor"
authors = ["Sparktype contributors"]
license = "MIT"
repository = "https://github.com/sparktype-project/sparktype"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.6.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2.0.0"
tauri-plugin-mcp = { version = "0.4.27", optional = true }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

[features]
# Dev-only automation/remote-control plugin. Enabled by `npm run tauri:dev`; never by release
# builds, and lib.rs additionally requires debug_assertions so it cannot ship even if enabled.
mcp = ["dep:tauri-plugin-mcp"]
